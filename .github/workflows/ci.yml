name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum supported version in pyproject.toml; 3.12 matches local dev.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  postgres:
    name: Test on PostgreSQL 16
    runs-on: ubuntu-latest
    # Matches the PostgreSQL version to provision on Render. A throwaway container per run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fridgefit
          POSTGRES_PASSWORD: fridgefit
          POSTGRES_DB: fridgefit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The fixtures run every database test, including the migrations, against this database.
      TEST_DATABASE_URL: postgresql+psycopg://fridgefit:fridgefit@localhost:5432/fridgefit_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches local development; Vite 8 needs Node 20.19+ or 22.12+.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc -b type-checks, then vite build bundles; either failing fails the job.
      - name: Type-check and build
        run: npm run build
