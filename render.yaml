# Render Blueprint: the deployed frontend, backend, and PostgreSQL database. Applied from the
# Render dashboard (New > Blueprint). No secrets live here: DATABASE_URL is linked from the
# database; the URLs below are public.

services:
  - type: web
    name: fridgefit-api
    runtime: python
    plan: free
    # Same region as the database, so the API uses Render's private network; near the developer.
    region: virginia
    buildCommand: pip install .
    # Migrations run before the API starts. The free plan has no pre-deploy command, so this also
    # runs on every restart; `upgrade head` does nothing when the database is already current.
    startCommand: alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    # Answers only when the API can reach PostgreSQL (SELECT 1).
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Stored times are the user's naive local time, and "today" defaults to the server's date.
      # Render's clock is UTC, so pin the single user's timezone (daylight saving included).
      - key: TZ
        value: America/New_York
      - key: DATABASE_URL
        fromDatabase:
          name: fridgefit-db
          property: connectionString
      # The only browser origin CORS allows: the static site below. Render assigned the suffix
      # because fridgefit.onrender.com belongs to someone else; never allow that origin.
      - key: FRONTEND_ORIGIN
        value: https://fridgefit-3f2a.onrender.com
      # AI meal planning (POST /meal-plans): the configuration the evaluation recommended.
      - key: PLANNER_MODEL
        value: claude-haiku-5-5
      - key: PLANNER_EFFORT
        value: low
      # The endpoint is public, so this bounds what anyone can spend per day (resets at
      # midnight and on restart); past it, requests get the deterministic plan.
      - key: PLANNER_DAILY_LIMIT
        value: "50"
      # Secret: entered in the Render dashboard, never committed. Without it AI planning is off.
      - key: ANTHROPIC_API_KEY
        sync: false

  # The React build, served as static files from Render's CDN (no region, no server process).
  - type: web
    name: fridgefit
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Matches the Node version CI builds the frontend with.
      - key: NODE_VERSION
        value: "22"
      # Read by Vite at build time and baked into the JavaScript, so it is public, not a secret.
      - key: VITE_API_BASE_URL
        value: https://fridgefit-api.onrender.com

databases:
  - name: fridgefit-db
    plan: free
    # Fixed at creation; must match the web service's region.
    region: virginia
    # Matches the PostgreSQL version CI tests against.
    postgresMajorVersion: "16"
    databaseName: fridgefit
    user: fridgefit
